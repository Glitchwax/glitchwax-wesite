<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitch Wax | Coming Soon</title>
    <style>
        :root {
            --bg-dark: #0b0b0f;
            --text-main: #ffffff;
            --text-muted: #c7c7d1;
            --accent: #ff2bd6;
            --accent-2: #00f5ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(255, 43, 214, 0.18), transparent 35%),
                radial-gradient(circle at bottom right, rgba(0, 245, 255, 0.16), transparent 35%),
                var(--bg-dark);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .lander {
            max-width: 700px;
            width: 100%;
            padding: 3rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 24px;
            background: rgba(10, 10, 16, 0.72);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
        }

        .logo {
            max-width: 220px;
            width: 70%;
            height: auto;
            margin-bottom: 2rem;
        }

        h1 {
            margin: 0 0 1rem;
            font-size: clamp(2.2rem, 7vw, 4.5rem);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .glitch {
            text-shadow:
                2px 0 var(--accent),
                -2px 0 var(--accent-2);
        }

        p {
            margin: 0 auto;
            max-width: 540px;
            color: var(--text-muted);
            font-size: 1.15rem;
            line-height: 1.6;
        }

        .small {
            margin-top: 2rem;
            font-size: 0.95rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <main class="lander">
        <img src="images/logo.png" alt="Glitch Wax logo" class="logo">

        <h1 class="glitch">Coming Soon</h1>

        <p>
            Glitch Wax is getting ready to launch. Check back soon for board wax,
            product details, and ordering information.
        </p>

        <p class="small">
            Quality board wax. Great value. No glitch in the system.
        </p>
    </main>
</body>
</html>
